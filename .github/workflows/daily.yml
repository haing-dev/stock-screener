name: Daily prices
# Early each morning (US time) after a trading day: the previous close for every company, screens re-applied,
# portal updated. Stops after one price check when there is no new trading day (holidays). Tuesday-Saturday
# 09:15 UTC = after Monday-Friday sessions.
on:
  schedule:
    - cron: "15 9 * * 2-6"
  workflow_dispatch:

concurrency:
  group: portal
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}   # optional (free): maps 13F holdings to tickers ~60x faster
      PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          for v in SEC_USER_AGENT MASSIVE_API_KEY PORTAL_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore screen state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: cache/state
          key: state-v1-${{ github.run_id }}
          restore-keys: state-v1-

      - name: Screen state from the last screen run (if the cache was evicted)
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh run list --workflow screen.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)"
          if [ -n "$id" ]; then gh run download "$id" -n portal-state -D cache/state || echo "no state artifact on run $id"; fi

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: cache/prices
          key: prices-v1-${{ github.run_id }}
          restore-keys: prices-v1-

      - name: Re-price
        id: reprice
        if: hashFiles('cache/state/state.json.gz') != ''
        run: bash scripts/run_logged.sh python screener.py portal-daily

      - name: Build portal data
        id: export
        if: steps.reprice.outcome == 'success' && steps.reprice.outputs.new_day != 'false'
        run: bash scripts/run_logged.sh python screener.py portal-export

      - name: Publish
        if: steps.export.outcome == 'success' && steps.export.outputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh "Prices $(date -u +%Y-%m-%d)"

      - name: Record the lists (forward record, branch 'history')
        if: steps.export.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python screener.py history-snapshot --kind daily && bash scripts/append_history.sh || echo "::warning::list snapshot not recorded"

      - name: Save price cache
        if: always() && steps.reprice.outputs.new_day != 'false'
        uses: actions/cache/save@v4
        with:
          path: cache/prices
          key: prices-v1-${{ github.run_id }}

      - name: Save screen state
        if: always() && steps.reprice.outputs.new_day == 'true' && hashFiles('cache/state/state.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/state
          key: state-v1-${{ github.run_id }}

      - name: Delete superseded cache copies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_caches.sh prices-v1- state-v1-
