name: Screen
# Full screen of every NYSE + Nasdaq company from SEC filings, every company priced, portal rebuilt.
# Runs on the 1st and 16th of each month. Actions > Screen > Run workflow starts it by hand.
# Only companies that filed since the last run are downloaded again (SEC daily index); a new data format is filled
# from SEC's bulk files. Slow fills (price history, 13F, insiders, descriptions) run in the Background workflow.
on:
  schedule:
    - cron: "17 9 1,16 * *"
  workflow_dispatch:
    inputs:
      workbook:
        description: "Also keep the Excel results workbook (download from the run page)"
        type: boolean
        default: false

concurrency:
  group: portal
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}   # optional (free): maps 13F holdings to tickers ~60x faster
      PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
      PYTHONUNBUFFERED: "1"
      SCREEN_WORKBOOK: ${{ inputs.workbook && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          for v in SEC_USER_AGENT MASSIVE_API_KEY PORTAL_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore SEC data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/facts
            cache/submissions
            cache/universe.json.gz
            cache/sec_sync.json.gz
            cache/sec_meta.json.gz
          key: sec-v1-${{ github.run_id }}
          restore-keys: sec-v1-

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: cache/prices
          key: prices-v1-${{ github.run_id }}
          restore-keys: prices-v1-

      - name: Restore the last screen state (only its publish fingerprint is used; the screen rebuilds the state)
        uses: actions/cache/restore@v4
        with:
          path: cache/state
          key: state-v1-${{ github.run_id }}
          restore-keys: state-v1-

      - name: Run all screens
        run: bash scripts/run_logged.sh python screener.py portal-screen

      - name: Build portal data
        id: export
        run: bash scripts/run_logged.sh python screener.py portal-export

      - name: Publish
        if: steps.export.outputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh "Screen $(date -u +%Y-%m-%d)"

      - name: Save SEC data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/facts
            cache/submissions
            cache/universe.json.gz
            cache/sec_sync.json.gz
            cache/sec_meta.json.gz
          key: sec-v1-${{ github.run_id }}

      - name: Record the lists (forward record, branch 'history')
        if: steps.export.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python screener.py history-snapshot --kind screen && bash scripts/append_history.sh || echo "::warning::list snapshot not recorded"

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/prices
          key: prices-v1-${{ github.run_id }}

      - name: Save screen state (cache, read by the daily and background jobs)
        if: always() && hashFiles('cache/state/state.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/state
          key: state-v1-${{ github.run_id }}

      - name: Save screen state (artifact, backup if the cache is evicted)
        if: hashFiles('cache/state/state.json.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: portal-state
          path: cache/state
          retention-days: 20

      - name: Keep the workbook
        if: inputs.workbook
        uses: actions/upload-artifact@v4
        with:
          name: screen-results
          path: output/*.xlsx
          retention-days: 14
          if-no-files-found: ignore

      - name: Delete superseded cache copies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_caches.sh sec-v1- prices-v1- state-v1-
