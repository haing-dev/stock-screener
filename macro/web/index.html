<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Macro Compass</title>
<meta name="description" content="Where the US economy is in its cycle, and which industries that puts at risk or in favour. Backtested.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Ccircle cx='16' cy='16' r='9' stroke='%23f0efec' stroke-width='2.5' fill='none'/%3E%3Cpath d='M16 9l3 7-3 7-3-7z' fill='%232a78d6'/%3E%3C/svg%3E">
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="on">
    <h1>Macro Compass</h1>
    <p class="muted">Enter the password to open the latest reading.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit" id="unlockBtn">Open</button>
    <p id="lockMsg" class="lock-msg" role="alert"></p>
  </form>
</div>

<div id="shell" hidden>
<header class="top">
  <div class="brand"><b>Macro Compass</b></div>
  <div class="seg tabs" id="tabs" role="tablist" aria-label="Pages">
    <button type="button" role="tab" data-p="reading">Analysis</button>
    <button type="button" role="tab" data-p="calls">Recommendation</button>
  </div>
</header>

<main>
<div id="pReading">
  <section class="hero" id="s0">
    <div class="step">Analysis</div>
    <div class="stage-line"><span class="sdot" id="stageDot"></span><h1 id="stageName"></h1></div>
    <p class="lead" id="stageWhy"></p>
    <ol class="points" id="points"></ol>
  </section>
  <section id="sA" class="point"></section>
  <section id="sB" class="point"></section>
  <section id="sC" class="point"></section>
</div>

<div id="pCalls" hidden>
  <section id="sX">
    <h2>1. The recommended equity portfolio exposure</h2>
    <div class="callnow" id="xHead"></div>
    <div class="score" id="xScore"></div>
    <div class="card"><div class="chart" id="xChart"></div></div>
    <p class="note" id="xNote"></p>
  </section>
  <section id="sS">
    <div class="shead"><h2>2. Sector calls</h2>
      <div class="seg" id="horizon" role="group" aria-label="Look ahead"><button type="button" data-h="6">Next 6 months</button><button type="button" data-h="12">Next 12 months</button></div></div>
    <p class="sub"><b id="actHead"></b> <span id="actWhy"></span></p>
    <div class="tablewrap"><table class="ind calls" id="indTable"></table></div>
  </section>
</div>
</main>
<footer class="foot" id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>
<script src="/app.js"></script>
</body>
</html>
